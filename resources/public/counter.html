<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter</title>
  <script src="js/alpine-3.15.11.min.js" defer></script>
</head>
<body>
  <div x-data = "{ count: 0 }">
    <output x-text="count"></output>
    <button x-on:click="count++">Increment</button>
  </div>
</body>
</html>
